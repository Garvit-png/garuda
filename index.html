<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>शब्दकोश, Garuda Prakashan</title>
  <meta name="description" content="Hindi–English dictionary by Garuda Prakashan. Search in Devanagari, Roman spelling or English, or paste a sentence. Works offline.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="शब्दकोश">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;800&family=Noto+Serif:wght@700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#/" aria-label="Shabdkosh, home">
        <span class="brand-hi" lang="hi">शब्दकोश</span>
        <span class="brand-en">Hindi–English dictionary by Garuda Prakashan</span>
      </a>
    </div>
  </header>

  <div class="search-bar">
    <form class="search wrap" role="search" id="search-form">
      <label for="q" class="sr-only">Search the dictionary</label>
      <div class="field">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="q" type="search" name="q" placeholder="Search in Hindi or English"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="search" aria-controls="view">
        <button type="button" id="clear" class="clear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
        </button>
      </div>
      <button type="button" id="cancel" class="cancel" hidden>Cancel</button>
    </form>
  </div>

  <p id="offline" class="offline" hidden>Offline. Search still works.</p>

  <main id="view" class="wrap" tabindex="-1"></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
